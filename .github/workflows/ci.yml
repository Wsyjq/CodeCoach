name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - run: python -m compileall app
      - run: python -m pytest tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: codecoach:ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: python -m pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: docker run -d --name codecoach-e2e -p 18101:8000 codecoach:ci
      - name: Wait for health check
        run: |
          for attempt in $(seq 1 30); do
            echo "Health check attempt ${attempt}/30"
            if curl --fail --silent http://127.0.0.1:18101/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: python tests/e2e/e2e_auth_regression.py
      - name: Print container logs
        if: always()
        run: docker logs codecoach-e2e
