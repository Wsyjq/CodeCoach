name: Bug report
description: Report a reproducible problem in CodeCoach
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials and private user data from this report.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python, Node.js, browser, and deployment method.
  - type: textarea
    attributes:
      label: Additional context
      description: Sanitized logs or screenshots. Do not include secrets or personal data.
