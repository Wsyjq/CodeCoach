name: Feature request
description: Propose a focused improvement to CodeCoach
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this change.
